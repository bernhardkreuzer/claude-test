workflows:
  ios-task-manager:
    name: TaskManager iOS Build
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Set up code signing for simulator build
        script: |
          xcodebuild -project TaskManager/TaskManager.xcodeproj \
            -scheme TaskManager \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            clean build
    artifacts:
      - TaskManager/build/Build/Products/**/*.app
    publishing:
      email:
        recipients: []
